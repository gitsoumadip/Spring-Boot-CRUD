spring.application.name=helloWorld
server.port=${SERVER_PORT:8090}

# =====================================================
# DATABASE
# =====================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/forest_budget}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE


# =====================================================
# FLYWAY
# =====================================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =====================================================
# JWT / OAuth2 Resource Server (Keycloak)
# =====================================================
# Uncomment when Keycloak is running:
# spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8080/realms/myrealm}


# =====================================================
# CORS Configuration for Frontend (React)
# =====================================================
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8090}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true



