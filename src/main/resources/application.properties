spring.application.name=helloWorld
server.port=8090

# =====================================================
# DATABASE
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/forest_budget
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE


# =====================================================
# FLYWAY
# =====================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =====================================================
# JWT / OAuth2 Resource Server (Keycloak)
# =====================================================
# Uncomment when Keycloak is running:
# spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/myrealm


# =====================================================
# CORS Configuration for Frontend (React)
# =====================================================
spring.web.cors.allowed-origins=http://localhost:8090
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true



